name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: avatar, bio, follower/star/repo counts, recent activity
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.about.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity
          config_order: header, activity

      # Card 2: most used languages bar
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 15

      # Card 3: isometric contribution calendar
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Card 4: one featured repository
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.repo.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_order: repositories
          repositories: "erfannaderi0/pneumonia_detection"

